apiVersion: apps/v1
kind: Deployment
metadata:
  name: palleturi-abbai
  labels:
    app: palleturi-abbai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: palleturi-abbai
  template:
    metadata:
      labels:
        app: palleturi-abbai
    spec:
      containers:
        - name: web
          image: palleturi-abbai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
